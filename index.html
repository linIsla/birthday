<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday! 小艾的波專屬生日驚喜</title>
  <!-- Google Fonts & Canvas Confetti -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1b162f 0%, #08060c 100%);
      color: #ffffff;
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* 背景星光粒子 */
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      padding: 20px;
      text-align: center;
    }

    /* ================= 階段一：禮物盒開場 ================= */
    .gift-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .gift-stage.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
      width: 100%;
    }

    .teaser-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .teaser-sub {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 40px;
      font-weight: 300;
    }

    /* 3D 禮物盒動畫 */
    .gift-box {
      width: 140px;
      height: 140px;
      position: relative;
      cursor: pointer;
      margin-bottom: 40px;
      transform-style: preserve-3d;
      animation: float 3s ease-in-out infinite, pulseGlow 2s ease-in-out infinite alternate;
    }

    .gift-box-body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e63946 0%, #b71c1c 100%);
      border-radius: 16px;
      position: absolute;
      box-shadow: 0 15px 35px rgba(230, 57, 70, 0.4);
    }

    /* 緞帶裝飾 */
    .ribbon-v {
      position: absolute;
      width: 26px;
      height: 100%;
      background: linear-gradient(135deg, #ffd700, #ffb700);
      left: 57px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
    .ribbon-h {
      position: absolute;
      height: 26px;
      width: 100%;
      background: linear-gradient(135deg, #ffd700, #ffb700);
      top: 57px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .bow {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 30px;
    }
    .bow-left, .bow-right {
      width: 30px;
      height: 30px;
      border: 5px solid #ffd700;
      border-radius: 50% 50% 0 50%;
      position: absolute;
      top: 0;
    }
    .bow-left { left: 0; transform: rotate(-30deg); }
    .bow-right { right: 0; transform: rotate(30deg) scaleX(-1); }

    .open-btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      border: none;
      padding: 16px 36px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .open-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 15px 30px rgba(255, 117, 140, 0.6);
    }

    /* ================= 階段二：影片與卡片內容 ================= */
    .content-stage {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
      pointer-events: none;
      display: none;
    }

    .content-stage.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      display: block;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #ffffff 0%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 響應式影片容器 */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 比率 */
      height: 0;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      margin-bottom: 28px;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .blessing-text {
      font-size: 1.1rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 30px;
      font-weight: 300;
      white-space: pre-line;
    }

    /* 互動按鈕區 */
    .interaction-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .heart-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ff6b81;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .heart-btn:hover {
      background: rgba(255, 107, 129, 0.2);
      transform: scale(1.05);
    }

    /* Keyframes 動畫 */
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 15px rgba(230, 57, 70, 0.4)); }
      100% { filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.7)); }
    }

    @media (max-width: 600px) {
      .teaser-title { font-size: 1.6rem; }
      .main-title { font-size: 1.8rem; }
      .glass-card { padding: 20px 16px; }
      .blessing-text { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- 背景星光粒子 Canvas -->
  <canvas id="stars-canvas"></canvas>

  <div class="container">
    <!-- 階段一：揭幕前奏 -->
    <div class="gift-stage" id="giftStage">
      <h2 class="teaser-title">Dear 波利 ✨</h2>
      <p class="teaser-sub">小艾準備了一份專屬波利的生日小禮物</p>
      
      <div class="gift-box" onclick="openSurprise()">
        <div class="bow">
          <div class="bow-left"></div>
          <div class="bow-right"></div>
        </div>
        <div class="gift-box-body">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
        </div>
      </div>

      <button class="open-btn" onclick="openSurprise()">點擊拆開驚喜 🎁</button>
    </div>

    <!-- 階段二：影片與祝福 -->
    <div class="content-stage" id="contentStage">
      <div class="glass-card">
        <h1 class="main-title">🎂 波利生日快樂！ Happy Birthday 🎂</h1>
        
        <!-- Vimeo 高質感極簡影片播放器 -->
        <div class="video-wrapper">
          <iframe 
            src="https://player.vimeo.com/video/1229614207?badge=0&autopause=0&player_id=0&app_id=58479&title=0&byline=0&portrait=0" 
            allow="autoplay; fullscreen; picture-in-picture" 
            allowfullscreen 
            style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;">
          </iframe>
        </div>

        <!-- 真心話祝福語 -->
        <p class="blessing-text">
          祝福波利新的一歲，所有的美好與幸運都如期而至！🌟
        </p>

        <!-- 互動點讚 -->
        <div class="interaction-bar">
          <button class="heart-btn" onclick="sendLove()">
            ❤️ 送上祝福 (<span id="loveCount">520</span>)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. 背景星光動畫
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.01 + 0.005
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffffff';
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    // 2. 點擊拆禮物與煙火特效
    function openSurprise() {
      const giftStage = document.getElementById('giftStage');
      const contentStage = document.getElementById('contentStage');

      giftStage.classList.add('hidden');
      
      setTimeout(() => {
        giftStage.style.display = 'none';
        contentStage.classList.add('active');
        triggerFireworks();
      }, 600);
    }

    function triggerFireworks() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { 
          particleCount, 
          origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
        }));
        confetti(Object.assign({}, defaults, { 
          particleCount, 
          origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
        }));
      }, 250);
    }

    // 3. 愛心點讚互動
    let count = 520;
    function sendLove() {
      count++;
      document.getElementById('loveCount').innerText = count;
      confetti({
        particleCount: 25,
        spread: 60,
        origin: { y: 0.8 },
        colors: ['#ff6b81', '#ff758c']
      });
    }
  </script>
</body>
</html>
